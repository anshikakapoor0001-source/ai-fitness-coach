name: keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          curl -L \
               --retry 3 \
               --retry-delay 5 \
               --max-time 120 \
               --fail \
               https://ai-fitness-coach-jlre.onrender.com/
