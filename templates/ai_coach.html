<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Coach</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <h2>🤖 AURA AI</h2>
            <p>Fitness Coach</p>
        </div>

        <ul class="menu">

            <li>
                <a href="javascript:history.back()" class="text-decoration-none text-dark">
                    🏠 Dashboard
                </a>
            </li>

            <a href="{{ url_for(
                'ai_coach',
                name=name,
                bmi=bmi,
                bmi_category=bmi_category,
                goal=goal,
                weight=weight,
                height=height,
                recommendation=recommendation,
                diet_plan=diet_plan,
                workout_plan=workout_plan
            ) }}">
                🤖 AI Coach
</a>

            <li>📷 Form Analysis</li>
            <li>📈 Progress</li>
            <li>⚙ Settings</li>

        </ul>

    </aside>

    <!-- Main -->
    <main class="main-content">

        <div class="header">

            <div>
                <h2>🤖 AI Coach</h2>
                <p>Hello {{ name }}, here's your personalized fitness plan.</p>
            </div>

        </div>

        <!-- Recommendation -->
        <div class="card-box mb-4">

            <h3>🤖 AI Recommendation</h3>

            <div class="mt-3">
                <pre>{{ recommendation }}</pre>
            </div>

        </div>

        <div class="row">

            <!-- Diet -->
            <div class="col-lg-6">

                <div class="card-box h-100">

                    <h3>🥗 Diet Plan</h3>

                    <hr>

                    <pre>{{ diet_plan }}</pre>

                </div>

            </div>

            <!-- Workout -->
            <div class="col-lg-6">

                <div class="card-box h-100">

                    <h3>🏋️ Workout Plan</h3>

                    <hr>

                    <pre>{{ workout_plan }}</pre>

                </div>

            </div>

        </div>

    </main>

</div>

</body>

</html>
