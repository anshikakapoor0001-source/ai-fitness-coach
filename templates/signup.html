{% extends "base.html" %}
{% block title %}Create account | Fitness AI{% endblock %}
{% block body %}
<main class="auth-page">
    {% include "_alerts.html" %}
    <section class="auth-card">
        <div class="auth-logo"><i class="bi bi-person-plus-fill"></i></div>
        <p class="eyebrow">FITNESS AI</p>
        <h1>Start your journey</h1>
        <p class="muted">Create an account, then we’ll personalize your plan.</p>
        <form action="{{ url_for('signup') }}" method="post" class="mt-4">
            <label for="email">Email address</label>
            <input id="email" type="email" name="email" class="form-control" autocomplete="email" required>
            <label for="password" class="mt-3">Password</label>
            <input id="password" type="password" name="password" class="form-control" autocomplete="new-password" minlength="8" required>
            <label for="confirm-password" class="mt-3">Confirm password</label>
            <input id="confirm-password" type="password" name="confirm_password" class="form-control" autocomplete="new-password" minlength="8" required>
            <button type="submit" class="btn btn-primary w-100 mt-4">Create account <i class="bi bi-arrow-right"></i></button>
        </form>
        <p class="auth-footer">Already registered? <a href="{{ url_for('home') }}">Sign in</a></p>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
