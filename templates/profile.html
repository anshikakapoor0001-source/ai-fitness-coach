{% extends "base.html" %}
{% block title %}Your profile | Fitness AI{% endblock %}
{% block body %}
<main class="auth-page profile-page">
    {% include "_alerts.html" %}
    <section class="auth-card profile-card">
        <div class="auth-logo"><i class="bi bi-person-vcard-fill"></i></div>
        <p class="eyebrow">PERSONALIZATION</p>
        <h1>Tell us about yourself</h1>
        <p class="muted">This helps create a plan that fits your goals. You can update it anytime.</p>
        <form action="{{ url_for('recommend') }}" method="post" class="row g-3 mt-2">
            <div class="col-md-6"><label for="name">Name</label><input id="name" name="name" class="form-control" maxlength="80" required></div>
            <div class="col-md-6"><label for="age">Age</label><input id="age" type="number" name="age" class="form-control" min="13" max="100" required></div>
            <div class="col-md-6"><label for="height">Height (cm)</label><input id="height" type="number" step="0.1" name="height" class="form-control" min="100" max="250" required></div>
            <div class="col-md-6"><label for="weight">Weight (kg)</label><input id="weight" type="number" step="0.1" name="weight" class="form-control" min="30" max="350" required></div>
            <div class="col-12"><label for="goal">Primary goal</label><select id="goal" name="goal" class="form-select" required><option value="Weight Loss">Weight loss</option><option value="Muscle Gain">Muscle gain</option><option value="Maintain Fitness">Maintain fitness</option></select></div>
            <div class="col-12"><button type="submit" class="btn btn-primary w-100 mt-2">Generate my plan <i class="bi bi-stars"></i></button></div>
        </form>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
