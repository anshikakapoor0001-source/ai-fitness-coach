{% extends "base.html" %}
{% block title %}Sign in | Fitness AI{% endblock %}
{% block body %}
<main class="auth-page">
    {% include "_alerts.html" %}
    <section class="auth-card">
        <div class="auth-logo"><i class="bi bi-heart-pulse-fill"></i></div>
        <p class="eyebrow">FITNESS AI</p>
        <h1>Welcome back</h1>
        <p class="muted">Your training plan is waiting for you.</p>
        <form action="{{ url_for('login') }}" method="post" class="mt-4">
            <label for="email">Email address</label>
            <input id="email" type="email" name="email" class="form-control" autocomplete="email" required>
            <label for="password" class="mt-3">Password</label>
            <input id="password" type="password" name="password" class="form-control" autocomplete="current-password" required>
            <button type="submit" class="btn btn-primary w-100 mt-4">Sign in <i class="bi bi-arrow-right"></i></button>
        </form>
        <p class="auth-footer">New to Fitness AI? <a href="{{ url_for('signup') }}">Create an account</a></p>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
